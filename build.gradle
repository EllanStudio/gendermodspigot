plugins {
    id 'java'
}

group = 'dbrighthd'
version = '1.6.2'
def pluginVersion = version.toString()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

repositories {
    // repo1 is Maven Central's canonical mirror; it is more reliable than the
    // repo.maven.apache.org hostname in restricted CI networks.
    maven {
        name = 'centralMirror'
        url = uri('https://repo1.maven.org/maven2/')
    }
    mavenCentral()
    maven {
        name = 'papermc'
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
}

sourceSets {
    // Gradle convention automatically maps this to src/velocity/java and src/velocity/resources.
    velocity {
    }
}

dependencies {
    // Paper backend plugin: no local Spigot API dependency.
    compileOnly "io.papermc.paper:paper-api:${providers.gradleProperty('paperVersion').getOrElse('26.3.build.157-beta')}"
    testImplementation "io.papermc.paper:paper-api:${providers.gradleProperty('paperVersion').getOrElse('26.3.build.157-beta')}"
    compileOnly 'org.jetbrains:annotations:24.0.1'

    // Dedicated Velocity bridge source set.
    velocityCompileOnly 'com.velocitypowered:velocity-api:4.1.0-SNAPSHOT'
    velocityCompileOnly 'javax.inject:javax.inject:1'
    velocityAnnotationProcessor 'com.velocitypowered:velocity-api:4.1.0-SNAPSHOT'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Keep Paper API migrations visible during development.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-Xlint:deprecation')
}

// Velocity's Guice/ASM cannot inspect Java 25 (major 69) plugin annotations yet.
// Compile only the bridge to Java 17 bytecode; Paper remains Java 25 / major 69.
// Resolve the API with the Java 25 build JVM, while javac emits Java 17 plugin classes.
configurations.named('velocityCompileClasspath') {
    attributes {
        attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
    }
}

tasks.named('compileVelocityJava', JavaCompile) {
    options.release.set(17)
}

// Guard against reintroducing the Java 25 annotation-scanning failure in Velocity's Guice/ASM.
def velocityPluginClass = layout.buildDirectory.file(
        'classes/java/velocity/dbrighthd/wildfiregendermodplugin/VelocityPlugin.class')
tasks.register('verifyVelocityBytecode') {
    dependsOn tasks.named('compileVelocityJava')
    inputs.file(velocityPluginClass)
    doLast {
        byte[] bytes = velocityPluginClass.get().asFile.bytes
        int major = ((bytes[6] & 0xff) << 8) | (bytes[7] & 0xff)
        if (major != 61) {
            throw new GradleException('VelocityPlugin.class must be Java 17 / major 61, found major ' + major)
        }
    }
}
tasks.named('check') {
    dependsOn tasks.named('verifyVelocityBytecode')
}

// Default JAR is the Paper backend plugin only.
tasks.named('jar', Jar) {
    archiveBaseName.set('Female-Gender-Mod-Paper')
    archiveClassifier.set('')
    archiveVersion.set(project.version.toString())
}

tasks.named('sourcesJar', Jar) {
    archiveBaseName.set('Female-Gender-Mod-Paper')
    archiveClassifier.set('sources')
    archiveVersion.set(project.version.toString())
}

// Velocity has a separate classpath and its own generated velocity-plugin.json.
tasks.register('velocityJar', Jar) {
    group = 'build'
    description = 'Assembles the standalone Velocity bridge plugin.'
    archiveBaseName.set('Female-Gender-Mod-Velocity')
    archiveClassifier.set('')
    archiveVersion.set(project.version.toString())
    from(sourceSets.velocity.output)
}

tasks.register('velocitySourcesJar', Jar) {
    group = 'build'
    description = 'Assembles sources for the Velocity bridge plugin.'
    archiveBaseName.set('Female-Gender-Mod-Velocity')
    archiveClassifier.set('sources')
    archiveVersion.set(project.version.toString())
    from(sourceSets.velocity.allSource)
}

tasks.named('assemble') {
    dependsOn tasks.named('velocityJar')
    dependsOn tasks.named('velocitySourcesJar')
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: pluginVersion)
    }
}
