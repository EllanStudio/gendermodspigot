# Female Gender Mod Paper backend plugin
#
# Cross-server synchronisation is event-driven and is enabled by installing the
# separate Female-Gender-Mod-Velocity JAR on a Velocity proxy. There is no
# broadcast interval, polling task, or tick scheduler.
#
# Set the SAME non-empty random secret in this file on every Paper backend and
# in the Velocity bridge's config.properties. Leaving it blank safely disables
# cross-server traffic while single-server sync keeps working.
velocity:
  shared-secret: ""

logging:
  enabled: true
  debug: false
